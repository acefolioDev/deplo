name: Agent release
on:
  push:
    tags: ['agent-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Build and checksum
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags='-s -w' -o "dist/deplo-agent-linux-$arch" ./cmd/deplo-agent
          done
          cd dist
          sha256sum deplo-agent-linux-* > SHA256SUMS
        working-directory: agent
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" agent/dist/* --title "$GITHUB_REF_NAME" --generate-notes
