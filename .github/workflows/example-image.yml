name: Example image
on:
  push:
    branches: [main]
    paths: ['examples/nestjs/**', '.github/workflows/example-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: examples/nestjs
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/deplo-example:${{ github.sha }}
