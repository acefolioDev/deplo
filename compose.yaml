services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deplo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: deplo
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deplo -d deplo"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://deplo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/deplo
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://deplo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/deplo
      PUBLIC_URL: https://${DEPLO_DOMAIN:?set DEPLO_DOMAIN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      REGISTRATION_CODE: ${REGISTRATION_CODE:?set REGISTRATION_CODE}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DEPLO_DOMAIN: ${DEPLO_DOMAIN:?set DEPLO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.control:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  db_data:
  caddy_data:
  caddy_config:
